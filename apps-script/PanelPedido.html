<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --accent: #b5532e; --accent-dark: #8a3e22; --ink: #2b2420; --soft: #6b625b; --line: #e5ddd3; --bg: #fbf8f4; --warn: #b45309; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: Arial, sans-serif; font-size: 13px; color: var(--ink); background: var(--bg); margin: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 0 0 10px; }
    label, .etiqueta { display: block; font-weight: bold; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
    input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in oklab, var(--accent) 35%, transparent); border-color: var(--accent); }
    input[type=checkbox] { width: auto; margin: 0; }
    .hint { color: var(--soft); font-size: 11px; margin-top: 4px; line-height: 1.35; }
    .aviso { color: var(--warn); font-size: 11px; margin-top: 4px; }
    .error { color: #b91c1c; margin-top: 10px; min-height: 1em; }
    .oculto { display: none !important; }

    /* Pestañas */
    .tabs { display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--line); background: #fff; }
    .tab { border: 0; background: none; padding: 9px 14px; font: inherit; font-weight: bold; color: var(--soft); cursor: pointer; border-bottom: 3px solid transparent; }
    .tab.activa { color: var(--accent); border-bottom-color: var(--accent); }
    .contenido { height: calc(100% - 44px); }

    /* Nuevo pedido: datos generales + totales a la izquierda, productos a la derecha. */
    .layout { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
    .lateral { padding: 16px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
    .lateral .espacio { flex: 1; min-height: 12px; }
    .productos { padding: 16px 18px 12px; overflow-y: auto; }

    .vendedoras { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .opcion { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px; font: inherit; font-weight: bold; cursor: pointer; color: var(--ink); }
    .opcion.elegida { border: 2px solid var(--accent); color: var(--accent-dark); background: color-mix(in oklab, var(--accent) 8%, #fff); padding: 8px; }
    .cliente { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: #dcfce7; color: #166534; font-size: 12px; }

    .resumen { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 16px; }
    .linea { display: flex; justify-content: space-between; align-items: baseline; }
    .total { font-size: 18px; font-weight: bold; }
    .resta { color: var(--soft); margin-top: 6px; }

    /* Cada producto es una tarjeta con filas. */
    .item { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .item .cabecera { display: grid; grid-template-columns: 24px 1fr 26px; gap: 8px; align-items: center; }
    .item .num { font-weight: bold; color: var(--accent); text-align: center; }
    .fila { display: grid; gap: 8px; margin-top: 8px; align-items: end; }
    .fila label { margin: 0 0 3px; font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: .03em; }
    .fila-libre { grid-template-columns: 1fr 90px 90px; }
    .fila-precio { grid-template-columns: minmax(0, 1.6fr) 110px 110px 64px 96px; }
    .fila-piso { grid-template-columns: 100px 100px minmax(0, 1fr); }
    .subtotal { text-align: right; font-weight: bold; padding-bottom: 9px; }
    .check { display: inline-flex; align-items: center; gap: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .quitar { border: 0; background: none; color: var(--soft); cursor: pointer; font-size: 20px; line-height: 1; padding: 0; }
    .quitar:hover { color: #b91c1c; }

    button.primary { width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; }
    button.primary:hover { background: var(--accent-dark); }
    button.primary:disabled { opacity: .6; cursor: wait; }
    button.sec { background: #fff; color: var(--accent); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 14px; cursor: pointer; font: inherit; font-weight: bold; }
    button.link { background: none; border: 0; color: var(--soft); text-decoration: underline; cursor: pointer; margin-top: 10px; font: inherit; }

    #resultado { display: none; grid-template-columns: 1fr 280px; gap: 20px; padding: 18px; height: 100%; }
    #resultado textarea { height: calc(100% - 44px); min-height: 260px; font-size: 13px; line-height: 1.45; resize: none; }
    .ok { background: #dcfce7; color: #166534; padding: 10px 12px; border-radius: 8px; font-weight: bold; margin: 0 0 12px; }
    .wa { display: block; text-align: center; background: #25D366; color: #fff; border-radius: 8px; padding: 12px; font-weight: bold; font-size: 14px; text-decoration: none; margin-top: 8px; }
    .wa.deshabilitado { background: #d1d5db; color: #6b7280; pointer-events: none; }

    /* Pendientes */
    #pendientes { padding: 16px 18px; overflow-y: auto; height: 100%; }
    .pendiente { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .pendiente .arriba { display: flex; justify-content: space-between; gap: 10px; }
    .chip { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 999px; white-space: nowrap; align-self: flex-start; }
    .chip.datos { background: #fde68a; }
    .chip.pago { background: #fed7aa; }
    .acciones { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .acciones a, .acciones button { flex: 1; min-width: 120px; text-align: center; border-radius: 8px; padding: 9px; text-decoration: none; font: inherit; font-weight: bold; cursor: pointer; }
    .acciones a { background: #25D366; color: #fff; border: 0; }
    .acciones a.deshabilitado { background: #d1d5db; color: #6b7280; pointer-events: none; }
    .acciones button { background: #fff; border: 1px solid var(--line); color: var(--ink); }

    /* Celular: todo en una columna. */
    @media (max-width: 760px) {
      body { font-size: 15px; }
      input, select, textarea { font-size: 16px; padding: 10px; }
      .tabs { padding: 6px 10px 0; position: sticky; top: 0; z-index: 2; }
      .contenido { height: auto; }
      #resultado { grid-template-columns: 1fr; height: auto; }
      /* Orden en el celular: datos → productos → total y guardar (sin volver a subir). */
      .layout { display: flex; flex-direction: column; height: auto; }
      .lateral { display: contents; }
      .lateral .espacio { display: none; }
      .datos { order: 1; padding: 14px; border-bottom: 1px solid var(--line); }
      .productos { order: 2; }
      .cierre { order: 3; padding: 0 14px 20px; }
      .productos, #pendientes { padding: 14px; height: auto; }
      .fila-precio { grid-template-columns: 1fr 1fr; }
      .fila-precio .modelo-col { grid-column: 1 / -1; }
      .fila-libre { grid-template-columns: 1fr 1fr; }
      .fila-libre .producto-col { grid-column: 1 / -1; }
      .fila-piso { grid-template-columns: 1fr 1fr; }
      .fila-piso .piso-diseno-col { grid-column: 1 / -1; }
      .subtotal { text-align: left; }
      #resultado textarea { height: 300px; }
    }
  </style>
</head>
<body>
  <nav class="tabs">
    <button type="button" class="tab activa" data-tab="nuevo" onclick="mostrarTab('nuevo')">Nuevo pedido</button>
    <button type="button" class="tab" data-tab="pendientes" onclick="mostrarTab('pendientes')">Pendientes</button>
  </nav>

  <div class="contenido">
    <div id="formulario" class="layout">
      <aside class="lateral">
        <div class="datos">
        <span class="etiqueta" style="margin-top:0">Vendedora</span>
        <div class="vendedoras" id="vendedoras"></div>

        <label for="telefono">Teléfono del cliente</label>
        <input id="telefono" type="tel" inputmode="tel" placeholder="Ej. 11 1234 5678" onblur="buscarCliente()">
        <div id="clienteInfo" class="cliente oculto"></div>
        <div class="hint">Opcional. Con el teléfono se abre el chat directo y, si ya compró, el link llega con sus datos.</div>

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
        <label for="semana">Entrega estimada</label>
        <input type="date" id="semana">
        <div class="hint" id="semanaHint"></div>
        </div>

        <div class="espacio"></div>

        <div class="cierre">
        <div class="resumen">
          <div class="linea total"><span>Total</span><span id="total">$0</span></div>
          <div class="hint" id="cantidad"></div>
          <label for="sena">Seña</label>
          <input id="sena" type="number" inputmode="numeric" min="0" step="1000" placeholder="Igual al total" oninput="recalcular()">
          <div class="linea resta"><span>Resta</span><span id="resta">$0</span></div>
        </div>

        <div id="error" class="error"></div>
        <button type="button" class="primary" id="guardar" onclick="guardar()">Guardar y generar mensaje</button>
        </div>
      </aside>

      <section class="productos">
        <h2>Productos</h2>
        <div id="items"></div>
        <button type="button" class="sec" onclick="agregarItem(true)">+ Agregar producto</button>
      </section>
    </div>

    <div id="resultado">
      <div>
        <p class="ok" id="okTexto"></p>
        <textarea id="mensaje" readonly aria-label="Mensaje para el cliente"></textarea>
      </div>
      <div>
        <h2>Mensaje para el cliente</h2>
        <button type="button" class="primary" onclick="copiar(document.getElementById('mensaje').value, this)">Copiar mensaje</button>
        <a id="wa" class="wa" target="_blank" rel="noopener">Enviar por WhatsApp</a>
        <div id="waHint" class="hint oculto">No cargaste el teléfono: copiá el mensaje y pegalo en el chat del cliente.</div>
        <button type="button" class="sec" style="width:100%;margin-top:18px" onclick="reiniciar()">Cargar otro pedido</button>
        <button type="button" class="link soloVentana" onclick="google.script.host.close()">Cerrar</button>
      </div>
    </div>

    <div id="pendientes" class="oculto"></div>
  </div>

  <script>
    var MODO = '<?= modo ?>';
    var precios = [];
    var vendedora = '';
    var diasHabiles = 12;

    // ─── Utilidades ──────────────────────────────────────────────────────────
    function pesos(n) {
      return '$' + Math.round(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    function num(v) {
      var n = Number(String(v || '').replace(',', '.'));
      return isFinite(n) ? n : 0;
    }
    function metros(n) {
      return String(Math.round(n * 100) / 100).replace('.', ',');
    }
    function iso(d) {
      var c = new Date(d.getTime());
      c.setMinutes(c.getMinutes() - c.getTimezoneOffset());
      return c.toISOString().slice(0, 10);
    }
    /** Suma días hábiles (lunes a viernes) a una fecha. */
    function sumarDiasHabiles(desde, dias) {
      var d = new Date(desde.getTime());
      var sumados = 0;
      while (sumados < dias) {
        d.setDate(d.getDate() + 1);
        var dia = d.getDay();
        if (dia !== 0 && dia !== 6) sumados++;
      }
      return d;
    }
    /** "2,9 x 2,5 m" → { ancho: 2.9, alto: 2.5 } */
    function medidasDe(texto) {
      var m = String(texto || '').match(/([\d.,]+)\s*x\s*([\d.,]+)/i);
      return m ? { ancho: num(m[1]), alto: num(m[2]) } : { ancho: 0, alto: 0 };
    }
    function escapar(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function copiar(texto, boton) {
      var listo = function () {
        var original = boton.textContent;
        boton.textContent = '¡Copiado!';
        setTimeout(function () { boton.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(listo, function () { copiarViejo(texto); listo(); });
      } else {
        copiarViejo(texto);
        listo();
      }
    }
    function copiarViejo(texto) {
      var t = document.createElement('textarea');
      t.value = texto;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }

    // ─── Pestañas ────────────────────────────────────────────────────────────
    function mostrarTab(tab) {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('activa', b.dataset.tab === tab); });
      var nuevo = tab === 'nuevo';
      var enResultado = document.getElementById('resultado').dataset.visible === '1';
      document.getElementById('pendientes').classList.toggle('oculto', nuevo);
      document.getElementById('formulario').classList.toggle('oculto', !nuevo || enResultado);
      document.getElementById('resultado').style.display = nuevo && enResultado ? 'grid' : 'none';
      if (!nuevo) cargarPendientes();
    }

    // ─── Vendedora y cliente ─────────────────────────────────────────────────
    function pintarVendedoras(lista) {
      document.getElementById('vendedoras').innerHTML = lista.map(function (v) {
        return '<button type="button" class="opcion" data-v="' + escapar(v) + '" onclick="elegirVendedora(this.dataset.v)">' + escapar(v) + '</button>';
      }).join('');
    }
    function elegirVendedora(v) {
      vendedora = v;
      if (v && document.getElementById('error').textContent === 'Elegí la vendedora.') document.getElementById('error').textContent = '';
      document.querySelectorAll('.opcion').forEach(function (b) { b.classList.toggle('elegida', b.dataset.v === v); });
    }
    function buscarCliente() {
      var tel = document.getElementById('telefono').value;
      var info = document.getElementById('clienteInfo');
      info.classList.add('oculto');
      if (tel.replace(/\D/g, '').length < 8) return;
      google.script.run
        .withSuccessHandler(function (c) {
          if (!c) return;
          info.textContent = '✓ Cliente: ' + (c.nombre || 'sin nombre') + ' · ' + c.pedidos + (c.pedidos === 1 ? ' compra' : ' compras') + '. El link llega con sus datos.';
          info.classList.remove('oculto');
        })
        .buscarCliente(tel);
    }

    // ─── Productos ───────────────────────────────────────────────────────────
    function opcionesPrecios() {
      var html = '<option value="">Elegí producto y medida…</option>';
      precios.forEach(function (p, i) {
        html += '<option value="' + i + '">' + escapar(p.producto + ' · ' + p.medidas + ' · ' + pesos(p.precio)) + '</option>';
      });
      return html + '<option value="otro">Otro / medida especial</option>';
    }

    function agregarItem(enfocar) {
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<div class="cabecera">' +
          '<span class="num"></span>' +
          '<select class="lista" onchange="elegirPrecio(this)" aria-label="Producto y medida">' + opcionesPrecios() + '</select>' +
          '<button type="button" class="quitar" title="Quitar producto" onclick="quitarItem(this)">×</button>' +
        '</div>' +
        '<div class="fila fila-libre oculto">' +
          '<div class="producto-col"><label>Producto</label><input class="producto" placeholder="Ej. Fondo especial"></div>' +
          '<div><label>Ancho (m)</label><input class="ancho" inputmode="decimal" placeholder="2,9" oninput="actualizarPiso(this)"></div>' +
          '<div><label>Alto (m)</label><input class="alto" inputmode="decimal" placeholder="3,5" oninput="actualizarPiso(this)"></div>' +
        '</div>' +
        '<div class="fila fila-precio">' +
          '<div class="modelo-col"><label>Modelo / diseño</label><input class="modelo" placeholder="Ej. Bosque encantado"></div>' +
          '<div><label>Precio</label><input class="precio" type="number" inputmode="numeric" min="0" step="1000" oninput="recalcular()"></div>' +
          '<div><label>Precio diseño</label><input class="diseno" type="number" inputmode="numeric" min="0" step="1000" placeholder="0" oninput="recalcular()"></div>' +
          '<div><label>Cant.</label><input class="cantidad" type="number" inputmode="numeric" min="1" value="1" oninput="recalcular()"></div>' +
          '<div class="subtotal">$0</div>' +
        '</div>' +
        '<label class="check"><input type="checkbox" class="incluyePiso" onchange="togglePiso(this)"> Incluye piso</label>' +
        '<div class="fila fila-piso oculto">' +
          '<div><label>Largo pared (m)</label><input class="pared" inputmode="decimal" oninput="actualizarPiso(this, \'pared\')"></div>' +
          '<div><label>Largo piso (m)</label><input class="piso" inputmode="decimal" oninput="actualizarPiso(this, \'piso\')"></div>' +
          '<div class="piso-diseno-col"><label>Diseño de piso</label><input class="pisoDiseno" placeholder="Ej. Madera clara"></div>' +
        '</div>' +
        '<div class="aviso oculto"></div>';
      document.getElementById('items').appendChild(div);
      numerar();
      recalcular();
      if (enfocar) div.querySelector('.lista').focus();
    }

    function quitarItem(boton) {
      boton.closest('.item').remove();
      if (!document.querySelectorAll('.item').length) agregarItem();
      numerar();
      recalcular();
    }

    function numerar() {
      document.querySelectorAll('.item').forEach(function (el, i) { el.querySelector('.num').textContent = i + 1; });
    }

    function elegirPrecio(select) {
      var item = select.closest('.item');
      var otro = select.value === 'otro';
      item.querySelector('.fila-libre').classList.toggle('oculto', !otro);
      var p = precios[Number(select.value)];
      if (otro) {
        ['producto', 'ancho', 'alto'].forEach(function (c) { item.querySelector('.' + c).value = ''; });
        item.querySelector('.producto').focus();
      } else {
        var m = medidasDe(p ? p.medidas : '');
        item.querySelector('.producto').value = p ? p.producto : '';
        item.querySelector('.ancho').value = m.ancho ? metros(m.ancho) : '';
        item.querySelector('.alto').value = m.alto ? metros(m.alto) : '';
        if (p) item.querySelector('.precio').value = p.precio;
        item.querySelector('.modelo').focus();
      }
      actualizarPiso(select);
      recalcular();
    }

    function togglePiso(check) {
      var item = check.closest('.item');
      item.querySelector('.fila-piso').classList.toggle('oculto', !check.checked);
      if (check.checked) item.querySelector('.pared').focus();
      actualizarPiso(check);
    }

    /**
     * Con piso, pared + piso tienen que sumar el alto del fondo. Al cargar uno se completa el otro
     * (si el otro no se escribió a mano), y si no suman se muestra un aviso (no bloquea).
     */
    function actualizarPiso(campo, origen) {
      var item = campo.closest('.item');
      var alto = num(item.querySelector('.alto').value);
      var pared = item.querySelector('.pared');
      var piso = item.querySelector('.piso');
      if (origen) item.querySelector('.' + origen).dataset.manual = '1';
      if (alto && origen === 'pared' && !piso.dataset.manual && num(pared.value) < alto) piso.value = metros(alto - num(pared.value));
      if (alto && origen === 'piso' && !pared.dataset.manual && num(piso.value) < alto) pared.value = metros(alto - num(piso.value));

      var aviso = item.querySelector('.aviso');
      var conPiso = item.querySelector('.incluyePiso').checked;
      var suma = num(pared.value) + num(piso.value);
      var mal = conPiso && alto && num(pared.value) && num(piso.value) && Math.abs(suma - alto) > 0.01;
      aviso.textContent = mal ? 'Pared + piso suman ' + metros(suma) + ' m y el alto es ' + metros(alto) + ' m.' : '';
      aviso.classList.toggle('oculto', !mal);
    }

    function leerItems() {
      return Array.prototype.map.call(document.querySelectorAll('.item'), function (el) {
        var conPiso = el.querySelector('.incluyePiso').checked;
        return {
          producto: el.querySelector('.producto').value,
          modelo: el.querySelector('.modelo').value,
          ancho: num(el.querySelector('.ancho').value),
          alto: num(el.querySelector('.alto').value),
          precio: num(el.querySelector('.precio').value),
          precioDiseno: num(el.querySelector('.diseno').value),
          cantidad: num(el.querySelector('.cantidad').value) || 1,
          incluyePiso: conPiso,
          largoPared: conPiso ? num(el.querySelector('.pared').value) : 0,
          largoPiso: conPiso ? num(el.querySelector('.piso').value) : 0,
          piso: conPiso ? el.querySelector('.pisoDiseno').value : '',
        };
      });
    }

    function recalcular() {
      var total = 0;
      var unidades = 0;
      document.querySelectorAll('.item').forEach(function (el) {
        var cantidad = num(el.querySelector('.cantidad').value) || 1;
        var sub = (num(el.querySelector('.precio').value) + num(el.querySelector('.diseno').value)) * cantidad;
        el.querySelector('.subtotal').textContent = pesos(sub);
        total += sub;
        unidades += cantidad;
      });
      var sena = num(document.getElementById('sena').value);
      if (!sena || sena > total) sena = total;
      document.getElementById('total').textContent = pesos(total);
      document.getElementById('resta').textContent = pesos(total - sena);
      document.getElementById('cantidad').textContent = unidades + (unidades === 1 ? ' producto' : ' productos');
      document.getElementById('sena').placeholder = 'Igual al total (' + pesos(total) + ')';
    }

    // ─── Guardar ─────────────────────────────────────────────────────────────
    function habilitarGuardar() {
      var boton = document.getElementById('guardar');
      boton.disabled = false;
      boton.textContent = 'Guardar y generar mensaje';
    }

    function guardar() {
      var error = document.getElementById('error');
      error.textContent = '';
      var items = leerItems().filter(function (it) { return it.producto || it.modelo; });
      if (!vendedora) { error.textContent = 'Elegí la vendedora.'; return; }
      if (!items.length) { error.textContent = 'Agregá al menos un producto.'; return; }
      if (items.some(function (it) { return !it.precio; })) { error.textContent = 'Falta el precio de algún producto.'; return; }
      if (items.some(function (it) { return it.incluyePiso && (!it.largoPared || !it.largoPiso); })) {
        error.textContent = 'Completá el largo de pared y de piso de los productos con piso.';
        return;
      }

      var boton = document.getElementById('guardar');
      boton.disabled = true;
      boton.textContent = 'Guardando…';
      google.script.run
        .withSuccessHandler(function (r) {
          var resultado = document.getElementById('resultado');
          resultado.dataset.visible = '1';
          document.getElementById('formulario').classList.add('oculto');
          resultado.style.display = 'grid';
          document.getElementById('okTexto').textContent = '✓ Pedido ' + r.id + ' guardado' + (r.cliente ? ' · ' + r.cliente : '');
          document.getElementById('mensaje').value = r.mensaje;
          var wa = document.getElementById('wa');
          if (r.whatsapp) { wa.href = r.whatsapp; wa.classList.remove('deshabilitado'); wa.removeAttribute('aria-disabled'); }
          else { wa.removeAttribute('href'); wa.classList.add('deshabilitado'); wa.setAttribute('aria-disabled', 'true'); }
          document.getElementById('waHint').classList.toggle('oculto', Boolean(r.whatsapp));
          window.scrollTo(0, 0);
        })
        .withFailureHandler(function (e) {
          error.textContent = e.message || String(e);
          habilitarGuardar();
        })
        .crearPedido({
          vendedora: vendedora,
          telefono: document.getElementById('telefono').value,
          fecha: document.getElementById('fecha').value,
          semanaEntrega: document.getElementById('semana').value,
          sena: num(document.getElementById('sena').value),
          items: items,
        });
    }

    function precargarFechas() {
      var hoy = new Date();
      document.getElementById('fecha').value = iso(hoy);
      document.getElementById('semana').value = iso(sumarDiasHabiles(hoy, diasHabiles));
      document.getElementById('semanaHint').textContent = 'Hoy + ' + diasHabiles + ' días hábiles. Podés cambiarla.';
    }

    function reiniciar() {
      document.getElementById('items').innerHTML = '';
      ['telefono', 'sena'].forEach(function (id) { document.getElementById(id).value = ''; });
      document.getElementById('clienteInfo').classList.add('oculto');
      document.getElementById('error').textContent = '';
      elegirVendedora('');
      precargarFechas();
      habilitarGuardar();
      agregarItem();
      var resultado = document.getElementById('resultado');
      resultado.dataset.visible = '';
      resultado.style.display = 'none';
      document.getElementById('formulario').classList.remove('oculto');
      window.scrollTo(0, 0);
    }

    // ─── Pendientes ──────────────────────────────────────────────────────────
    var pendientesCache = [];

    function cargarPendientes() {
      var cont = document.getElementById('pendientes');
      cont.innerHTML = '<p class="hint">Cargando…</p>';
      google.script.run
        .withSuccessHandler(function (lista) {
          pendientesCache = lista || [];
          if (!pendientesCache.length) { cont.innerHTML = '<p class="hint">No hay pedidos esperando datos ni pago. 🎉</p>'; return; }
          cont.innerHTML = '<h2>Esperan algo del cliente (' + pendientesCache.length + ')</h2>' + pendientesCache.map(function (p, i) {
            var datos = p.estado === 'Esperando datos';
            var dias = p.dias === null ? '' : (p.dias === 0 ? 'hoy' : 'hace ' + p.dias + (p.dias === 1 ? ' día' : ' días'));
            return '<div class="pendiente">' +
              '<div class="arriba"><div><strong>' + escapar(p.id) + '</strong> · ' + escapar(p.nombre || 'Sin nombre') +
                '<div class="hint">' + pesos(p.total) + (p.vendedora ? ' · ' + escapar(p.vendedora) : '') + (dias ? ' · link enviado ' + dias : '') + '</div></div>' +
                '<span class="chip ' + (datos ? 'datos' : 'pago') + '">' + escapar(p.estado) + '</span></div>' +
              '<div class="acciones">' +
                '<a target="_blank" rel="noopener" ' + (p.whatsapp ? 'href="' + escapar(p.whatsapp) + '"' : 'class="deshabilitado" aria-disabled="true"') + '>Recordar por WhatsApp</a>' +
                '<button type="button" onclick="copiar(pendientesCache[' + i + '].mensaje, this)">Copiar mensaje</button>' +
                '<button type="button" onclick="copiar(pendientesCache[' + i + '].link, this)">Copiar link</button>' +
              '</div></div>';
          }).join('');
        })
        .withFailureHandler(function (e) { cont.innerHTML = '<p class="error">' + escapar(e.message || e) + '</p>'; })
        .listarPendientes();
    }

    // ─── Inicio ──────────────────────────────────────────────────────────────
    if (MODO !== 'ventana') document.querySelectorAll('.soloVentana').forEach(function (el) { el.classList.add('oculto'); });
    precargarFechas();
    google.script.run
      .withSuccessHandler(function (d) {
        precios = d.precios || [];
        diasHabiles = d.diasHabiles || diasHabiles;
        pintarVendedoras(d.vendedoras || []);
        precargarFechas();
        agregarItem();
      })
      .withFailureHandler(function (e) {
        document.getElementById('error').textContent = e.message || String(e);
        agregarItem();
      })
      .datosIniciales();
  </script>
</body>
</html>
